apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-service
  namespace: dev
  labels:
    app: greeting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greeting-service
  template:
    metadata:
      labels:
        app: greeting-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: greeting-service
          image: ghcr.io/jerry-leung/greeting-service:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /greeting
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /greeting
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
