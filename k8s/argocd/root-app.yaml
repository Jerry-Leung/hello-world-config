apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jerry-Leung/hello-world-config.git
    targetRevision: master
    path: k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
